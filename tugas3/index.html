
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir Pendaftaran</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Pendaftaran Mahasiswa</h1>
        <p>Formulir calon mahasiswa baru</p>
    </header>

    <main>
        <h2>Formulir Pendaftaran</h2>

        <form action="detail.html" method="get">

            <label for="nama">Nama lengkap</label>
            <input type="text" id="nama" name="nama"
              placeholder="Masukkan nama lengkap" required>

            <label for="nomor">Nomor pendaftaran</label>
            <input type="text" id="nomor" name="nomor"
              placeholder="Masukkan nomor pendaftaran" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email"
              placeholder="nama@email.com" required>

            <label for="telepon">Nomor telepon</label>
            <input type="tel" id="telepon" name="telepon"
              placeholder="Masukkan nomor telepon">

            <label for="tanggal">Tanggal lahir</label>
            <input type="date" id="tanggal" name="tanggal_lahir">

            <label for="prodi">Program studi</label>
            <select id="prodi" name="program_studi" required>
                <option value="">Pilih program studi</option>
                <option value="Informatika">Informatika</option>
                <option value="Sistem Informasi">Sistem Informasi</option>
                <option value="Teknik Elektro">Teknik Elektro</option>
                <option value="Teknik Industri">Teknik Industri</option>
                <option value="Teknik Sipil">Teknik Sipil</option>
            </select>

            <label for="jalur">Jalur pendaftaran</label>
            <select id="jalur" name="jalur" required>
                <option value="">Pilih jalur pendaftaran</option>
                <option value="Reguler">Reguler</option>
                <option value="Prestasi">Prestasi</option>
                <option value="Mandiri">Mandiri</option>
            </select>

            <label for="alamat">Alamat</label>
            <textarea id="alamat" name="alamat" rows="3"
                      placeholder="Masukkan alamat"></textarea>

            <button type="submit">Kirim Pendaftaran</button>

        </form>
    </main>

    <footer>
        <p>Tugas Individu 3 - Pengembangan Aplikasi Web</p>
    </footer>

</body>
</html>
